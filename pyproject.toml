[project]
name = "design-pattern-mcp"
version = "1.0.1"
requires-python = ">=3.12"
description = "MCP server selecting design patterns for a described system (docs/implementation-guide.md pipeline)"
license = { text = "MIT" }
keywords = ["mcp", "fastmcp", "design-pattern", "selection"]
dependencies = [
    "fastmcp>=4.0.2",
    "pydantic>=2.12.0",
    "python-dotenv>=1.0.0",
    "click>=8.0.0",
    "aiosqlite>=0.20.0",
    "jsonschema>=4.23.0",
    "referencing>=0.35.0",
    "llama-index-core>=0.14.23,<0.15",
    "llama-index-llms-litellm>=0.7.1,<0.8",
    "llama-index-embeddings-litellm>=0.5.0,<0.6",
    "llama-index-retrievers-bm25>=0.7.1,<0.8",
    "llama-index-postprocessor-tei-rerank>=0.5.0,<0.6",
    "faiss-cpu>=1.14.3",
    "numpy>=1.26.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling>=1.0.0"]
build-backend = "hatchling.build"

[project.scripts]
design-pattern-mcp = "src.main:cli"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 120
target-version = "py312"
# Vulture whitelist contains intentional bare-name references (see whitelist.py).
extend-exclude = ["whitelist.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "DTZ", "T10", "ISC", "PIE", "PT", "RET", "SIM", "ARG", "PL", "TRY", "RUF"]
ignore = [
    "TRY003", "TRY300", "TRY301", "TRY400", "E501", "E741", "E401", "E402",
    "PLC0415", "PLR2004", "PLR0913", "PLR0917", "ARG001", "ARG002", "ARG005",
    "W293", "W291", "W292", "I001", "RUF012", "RUF013", "RUF022", "RUF002", "RUF100",
    "UP035", "UP036", "UP042", "DTZ001", "DTZ003", "PT011", "PT015", "PT017", "PT018",
    "SIM102", "SIM103", "SIM108", "SIM110", "SIM117", "SIM118", "RET504", "PLW0108",
    "B007", "B011", "B017", "B904",
]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
explicit_package_bases = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true
warn_unreachable = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
filterwarnings = [
    "ignore::DeprecationWarning",
    # fastmcp 4.x deliberately keeps Context.info/log on the MCP logging capability that the SDK
    # deprecates as of 2026-07-28 (SEP-2577); MCPDeprecationWarning subclasses UserWarning, so the
    # ignore above does not cover it. Not actionable until fastmcp ships the replacement — silence
    # that one message only, so other MCP deprecations (roots, elicitation) still surface. The
    # runtime counterpart is src/server.py::configure_logging.
    'ignore:The logging capability is deprecated:mcp.shared.exceptions.MCPDeprecationWarning',
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    # L2 PBT layer (docs/testing-strategies.md §3.3): the crosshair extra is the
    # documented "weak but useful peer" backend — same properties, second engine,
    # advisory only.
    "hypothesis[crosshair]>=6.100,<7",
    "ruff>=0.2.0",
    "mypy>=2.3.1",
    "pre-commit>=3.6.0",
    "vulture>=2.14",
    "deptry>=0.23.0",
    "types-jsonschema>=4.26.0.20260518",
]

# =============================================================================
# L3 mutation testing (docs/verification.md §L3)
# =============================================================================
[tool.mutmut]
# Mutate the whole src/ tree (mutants/src must be a COMPLETE package for imports
# to resolve during mutmut's pytest runs) and restrict mutation to the decision
# modules via do_not_mutate — everything else is copied unmutated (the critical
# 5-10% of the tree, never all of it).
source_paths = ["src/"]
# mutmut executes pytest from mutants/ — everything the selected tests READ
# must be present there (copied unmutated; mutmut always adds tests/,
# pyproject.toml and the lockfiles itself): the shim (verify/), the scripts the
# tests/verification meta-tests import, the real 7290-file catalogue, the
# docs the loader validates against, the repository config, the client
# examples (tests/unit/test_client_examples.py imports them by path) and the
# docker/systemd compose files (tests/unit/test_config.py pins their content).
# A missing copy aborts the stats run at collection (observed 2026-09-26:
# `examples/` missing → FileNotFoundError in the stats pass).
also_copy = [
    "verify/",
    "scripts/",
    "pattern/",
    "docs/",
    "config/",
    "examples/",
    "docker/",
    "systemd/",
]
# In-process shim: mutmut 3.7 asserts trampoline-hit module names never start
# with "src." (an src-LAYOUT convention guard) — this repo's import package IS
# `src`, so the stats run asserts on every legitimate hit. The plugin (copied
# into mutants/ via also_copy) relaxes exactly that assert; regular pytest runs
# never import it.
pytest_add_cli_args = ["-p", "verify.mutmut.mutmut_compat", "--hypothesis-profile=mutmut"]
# Kill-oracle selection: the whole executable L1+L2 corpus. mutmut runs this
# list once (its stats pass, which records which test covers which line) and
# then, per mutant, only the tests that touched the mutated function — so the
# selection is a superset duty, not a per-mutant cost. Directory entries are
# deliberate: a new test file joins the oracle automatically instead of
# silently dropping out of the kill authority.
#
# The one exclusion is the protocol smoke test, for RUNTIME reasons, not for
# scope: its 9 tests cost 137 s of the 179 s clean suite, so every mutant whose
# function it "covers" (133 of 174) paid that bill — the sweep was measured at
# ~4.5 h, versus ~40 min without it. It remains part of `make test-unit`; the
# three functions it was the ONLY cover for (`_freetext_validator`,
# `_pattern_name_validator`, `DesignPipeline.validate`) are pinned directly by
# tests/unit/test_input_validation.py and tests/unit/test_pipeline_validate.py.
pytest_add_cli_args_test_selection = [
    "tests/unit",
    "tests/verification",
    "--ignore=tests/unit/test_protocol_smoke.py",
]
# Per-mutant wall-clock ceiling: (clean-suite duration + timeout_constant) *
# timeout_multiplier. Upstream defaults (1.0 / 15.0) let a hung mutant burn ~16x
# the clean suite per run; 6x still leaves headroom over the per-mutant test
# runtime (mutmut runs only the tests that touched the function).
timeout_constant = 5.0
timeout_multiplier = 6.0
# Non-Python dependency policy: mutmut's default "warn" KEEPS cached results when
# a watched non-Python file changes, so a config or catalogue edit between two
# runs would let scripts/mutmut_baseline.py --gate distill stale verdicts.
# "rerun" resets all cached results instead. cache_invalidation_files pins the
# catalogue document the loader parses and the 7290 pattern files the
# loader/retriever mutants read.
on_dependency_change = "rerun"
cache_invalidation_files = ["docs/design-patterns.md", "docs/pattern-schema.json", "pattern/*.json"]
do_not_mutate = [
    # Rationale lives in verify/mutmut-scope.md — this list only mirrors it
    # (any change here must edit a ledger row in the same commit).
    # [Boundary — transport/serialization, covered by tests/unit only]
    "src/main.py",
    "src/server.py",
    "src/agent.py",
    "src/prompts/*",
    "src/schemas/*",
    "src/mcp_prompts/*",
    "src/resources/*",
    # Tool HANDLERS are boundary/serialization (arg coercion, error wrapping);
    # src/tools/jobs.py is the exception and IS mutated: the JobsStore state
    # machine is a Tier-B decision module (L1 transition matrix + L4
    # jobs_protocol/jobs_runner) and carries two garden anchors.
    "src/tools/__init__.py",
    "src/tools/_adapters.py",
    "src/tools/_execution.py",
    "src/tools/_heartbeat.py",
    "src/tools/analyze.py",
    "src/tools/cancel_design.py",
    "src/tools/design.py",
    "src/tools/evaluate.py",
    "src/tools/generate.py",
    "src/tools/get_design_status.py",
    "src/tools/patterns.py",
    "src/tools/submit_design_job.py",
    "src/reasoning/*",
    "src/errors.py",
    # [Deferred — scope sign-off pending, see mutmut-scope.md]
    "src/config.py",
    "src/design_validation.py",
    "src/patterns/embedder.py",
    "src/patterns/nodes.py",
    "src/patterns/safe_tei_rerank.py",
]

[tool.deptry]
known_first_party = ["src"]
extend_exclude = ["verify"]

[tool.deptry.per_rule_ignores]
# mcp is imported directly (annotations, types) but provided transitively via fastmcp.
DEP001 = ["mcp"]
DEP003 = ["mcp"]

