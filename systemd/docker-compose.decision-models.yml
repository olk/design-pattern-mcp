# Tacit override for the systemd stack: the env that points the Tacit seams at a
# gateway reachable over plain HTTP. The style head already runs in the base
# file — this overlay only re-states its env block explicitly, so provider/endpoint/
# model cannot drift between the two stacks.
#
# This file is an explicit opt-in layer, never a default — enable persistently via
# /etc/design-pattern-mcp/.env (see README "Decision models"):
#   COMPOSE_FILE=docker-compose.yml:docker-compose.decision-models.yml
# It also self-contains the base via `include:`, so a manual
# `docker compose -f docker-compose.decision-models.yml up -d` starts the full
# stack (mcp + style head + Tacit env) with no second -f. Path resolves relative
# to this file (Compose ≥2.20).
include:
  - path: docker-compose.yml
#
# The gateway URL defaults below assume the gateway runs on a host named `tacit`
# (DNS or /etc/hosts) publishing the AnyJev port; override per var for anything
# else. Enabling the Tacit seams additionally requires DECISIONS_*_ENABLED=true /
# RERANKER_PROVIDER=tacit (see README) — the overlay only sets the endpoints, it
# does not flip the switches.
#
# Security note: anyjev.serve has no auth of its own (same reason the dev compose
# confines Tacit to 127.0.0.1) — only point these URLs at a gateway on a trusted
# network, never at a publicly reachable port.

services:
  design-pattern-mcp:
    environment:
      # Ch2 style, served by the style-head service in the base file (CPU, no published
      # port — internal on pattern-tei-shared). Re-stated here so the two stacks cannot
      # drift on provider/endpoint/model.
      - DECISIONS_STYLE_ENABLED=${DECISIONS_STYLE_ENABLED:-true}
      - DECISIONS_STYLE_PROVIDER=${DECISIONS_STYLE_PROVIDER:-linear}
      - DECISIONS_STYLE_BASE_URL=${DECISIONS_STYLE_BASE_URL:-http://design-pattern-style-head:8800/v1}
      - DECISIONS_STYLE_MODEL=${DECISIONS_STYLE_MODEL:-style-linear}
      - DECISIONS_STYLE_CONFIDENCE_FLOOR=${DECISIONS_STYLE_CONFIDENCE_FLOOR:-0.6}
      # Rerank scorer switch (default tei). All four Tacit URLs below share one
      # override point: set TACIT_GATEWAY_URL once instead of each *_BASE_URL
      # (a per-seam var still wins when both are set).
      - RERANKER_PROVIDER=${RERANKER_PROVIDER:-tei}
      - RERANKER_TACIT_BASE_URL=${RERANKER_TACIT_BASE_URL:-${TACIT_GATEWAY_URL:-http://tacit:8100}}
      - RERANKER_TACIT_TIMEOUT_SECONDS=${RERANKER_TACIT_TIMEOUT_SECONDS:-60}
      # Tacit seams (J4 weights, J2 category, J5 gate). All off by default; the
      # gateway lives on a GPU host and is reached over plain HTTP. The timeouts
      # match the dev overlay; weights has no confidence floor (expected-level MAE path).
      - DECISIONS_WEIGHTS_ENABLED=${DECISIONS_WEIGHTS_ENABLED:-false}
      - DECISIONS_WEIGHTS_BASE_URL=${DECISIONS_WEIGHTS_BASE_URL:-${TACIT_GATEWAY_URL:-http://tacit:8100}}
      - DECISIONS_WEIGHTS_MODEL=${DECISIONS_WEIGHTS_MODEL:-tacit-4b}
      - DECISIONS_WEIGHTS_TIMEOUT_SECONDS=${DECISIONS_WEIGHTS_TIMEOUT_SECONDS:-30}
      - DECISIONS_CATEGORY_ENABLED=${DECISIONS_CATEGORY_ENABLED:-false}
      - DECISIONS_CATEGORY_BASE_URL=${DECISIONS_CATEGORY_BASE_URL:-${TACIT_GATEWAY_URL:-http://tacit:8100}}
      - DECISIONS_CATEGORY_MODEL=${DECISIONS_CATEGORY_MODEL:-tacit-4b}
      - DECISIONS_CATEGORY_CONFIDENCE_FLOOR=${DECISIONS_CATEGORY_CONFIDENCE_FLOOR:-0.5}
      - DECISIONS_CATEGORY_TIMEOUT_SECONDS=${DECISIONS_CATEGORY_TIMEOUT_SECONDS:-10}
      - DECISIONS_REASONING_GATE_ENABLED=${DECISIONS_REASONING_GATE_ENABLED:-false}
      - DECISIONS_REASONING_GATE_BASE_URL=${DECISIONS_REASONING_GATE_BASE_URL:-${TACIT_GATEWAY_URL:-http://tacit:8100}}
      - DECISIONS_REASONING_GATE_MODEL=${DECISIONS_REASONING_GATE_MODEL:-tacit-4b}
      - DECISIONS_REASONING_GATE_CONFIDENCE_FLOOR=${DECISIONS_REASONING_GATE_CONFIDENCE_FLOOR:-0.5}
      - DECISIONS_REASONING_GATE_TIMEOUT_SECONDS=${DECISIONS_REASONING_GATE_TIMEOUT_SECONDS:-5}

networks:
  pattern-tei-shared:
    external: true
