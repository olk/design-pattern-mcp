# Production Compose for systemd deployment.
#
# This file is a deployment variant of docker/docker-compose.yml:
#   - No `build:` sections (images must be pre-built from the dev compose
#     via `make docker-build-all` before enabling the service).
#   - Absolute paths everywhere.
#   - The systemd unit injects COMPOSE_PROJECT_NAME=dpml-systemd so this
#     stack is distinct from the dev compose.
#   - TEI sidecars are NOT defined here — they live in the shared
#     `pattern-tei-infra` stack (https://github.com/olk/pattern-tei-infra).
#     This stack joins the `pattern-tei-shared` external network to reach them.
#
# Every environment name set here must match a `{env:...}` placeholder in
# config/config.json. A name that does not is SILENTLY IGNORED (the server falls
# back to its built-in default) — e.g. `MCP_PORT` leaves the published port dead,
# because only `PORT` is read. The authoritative list is the config file itself:
#   grep -o '{env:[A-Z_]*' config/config.json | sort -u
#
# Installed at: /etc/design-pattern-mcp/docker-compose.yml

services:
  design-pattern-mcp:
    image: ${MCP_IMAGE:-design-pattern-mcp:latest}
    container_name: "design-pattern-mcp"
    networks: [pattern-tei-shared]
    environment:
      # Config path (the CLI --config flag overrides it).
      - CONFIG_PATH=/app/config/config.json

      # Generator (LLM): drives ANALYZE/GENERATE/EVALUATE — same MiniMax default
      # as the dev stack, overridable per deployment; the key falls back to
      # MINIMAXAI_API_KEY supplied by the unit's EnvironmentFile (.env).
      # Without a key the server still starts and retrieval works; each LLM call
      # fails with ERR_009 and the pipeline takes its degraded paths (E3/E4/E12).
      # The provider prefix lives in MODEL (litellm convention): the
      # GENERATOR_PROVIDER value only labels error messages.
      - GENERATOR_PROVIDER=${GENERATOR_PROVIDER:-minimax}
      - GENERATOR_MODEL=${GENERATOR_MODEL:-minimax/MiniMax-M2.7}
      - GENERATOR_BASE_URL=${GENERATOR_BASE_URL:-https://api.minimax.io/v1}
      - GENERATOR_API_KEY=${GENERATOR_API_KEY:-${MINIMAXAI_API_KEY:-}}
      - GENERATOR_TEMPERATURE=${GENERATOR_TEMPERATURE:-0.1}
      - GENERATOR_TOP_P=${GENERATOR_TOP_P:-1.0}
      - GENERATOR_TOP_K=${GENERATOR_TOP_K:-20}
      # Provider reliability knobs: applications per GENERATE call, the per-agent circuit
      # breaker and the whole-run execution budget (ERR_014 on expiry). All three are
      # independent of the per-provider-call timeout in config/config.json.
      - GENERATOR_GENERATION_BATCH_SIZE=${GENERATOR_GENERATION_BATCH_SIZE:-5}
      - GENERATOR_CIRCUIT_BREAKER_FAILURE_THRESHOLD=${GENERATOR_CIRCUIT_BREAKER_FAILURE_THRESHOLD:-3}
      - GENERATOR_CIRCUIT_BREAKER_COOLDOWN_SECONDS=${GENERATOR_CIRCUIT_BREAKER_COOLDOWN_SECONDS:-60.0}

      # Embedder: the /v1 suffix selects TEI's OpenAI-compatible route for litellm.
      # Client batch 8 == the sidecar's ORT max_batch_requests cap for this model;
      # a larger client batch is split into sequential sub-batches inside ONE HTTP
      # request and then outlives the client timeout (measured 2026-09-24).
      - EMBEDDER_BASE_URL=http://pattern-tei-embed:8080/v1
      - EMBEDDER_BATCH_SIZE=${EMBED_CLIENT_BATCH_SIZE:-8}
      - EMBEDDER_API_KEY=${EMBEDDER_API_KEY:-not-needed}

      - RERANKER_BASE_URL=http://pattern-tei-rerank:8080

      # Dense embedding cache: /app/data/dense-cache ships baked into the image
      # and is backed by the NAMED volume below, so the reloaded snapshot (zero
      # corpus embed calls once warm) survives image upgrades, container
      # recreation and `docker compose down`. Writing stays enabled so a model
      # swap or catalog edit re-embeds once and the result is reused by every
      # later start; set DENSE_CACHE_MODE=require to turn any cache/fingerprint
      # mismatch into a startup refusal instead of a silent re-embed.
      # Reset: `docker volume rm design-pattern-mcp-systemd-dense-cache` (a fresh
      # volume is re-seeded from the image's baked snapshot — an EXISTING one
      # keeps its own, so delete it after a catalogue/model-changing rebuild to
      # avoid one forced re-embed). For a genuinely cold cache use a cache-less
      # image or DENSE_CACHE_MODE=off.
      - DENSE_CACHE_PATH=/app/data/dense-cache
      - DENSE_CACHE_MODE=${DENSE_CACHE_MODE:-auto}
      - DENSE_CACHE_WRITE=true
      # Declared sidecar-model identity for the cache fingerprint (empty = probe decides).
      - EMBED_MODEL_REPO=${EMBED_MODEL_REPO:-}
      - EMBED_ONNX_VARIANT=${EMBED_ONNX_VARIANT:-}

      - PATTERN_DIRECTORY=/app/pattern

      - REASONING_ENABLED=true
      - REASONING_SPAWN_TIMEOUT_SECONDS=10
      - REASONING_STEP_TIMEOUT_SECONDS=20
      - REASONING_MAX_TOTAL_STEPS=8
      - REASONING_QUIET_STDERR=true
      - REASONING_FAIL_FAST=true
      # Decision model (JEV) Ch2 style substitution: opt-in, default off.
      - DECISIONS_ENABLED=${DECISIONS_ENABLED:-false}
      - DECISIONS_BASE_URL=${DECISIONS_BASE_URL:-https://opencode.ai/inference/systemone/v1}
      - DECISIONS_MODEL=${DECISIONS_MODEL:-jev-1.13-free}
      - DECISIONS_STYLE_CONFIDENCE_FLOOR=${DECISIONS_STYLE_CONFIDENCE_FLOOR:-0.5}
      - DECISIONS_TIMEOUT_SECONDS=${DECISIONS_TIMEOUT_SECONDS:-5}
      - OPENCODE_API_KEY=${OPENCODE_API_KEY:-}

      - TASKS_HEARTBEAT_ENABLED=true
      - TASKS_HEARTBEAT_INTERVAL_SECONDS=30
      - TASKS_DEADLINE_SECONDS=${TASKS_DEADLINE_SECONDS:-1800.0}
      - TRANSPORT=streamable-http
      - PORT=8050
      - LOGGING_LEVEL=INFO
      - LOGGING_FORMAT=json

    depends_on: []

    ports:
      - "8812:8050"
    volumes:
      - /etc/design-pattern-mcp/config:/app/config
      # Dense-cache snapshot (see the env block above): a NAMED volume keeps
      # it across image upgrades and container recreation. Force a cold
      # re-embed: DENSE_CACHE_MODE=off, or build a cache-less image;
      # `docker volume rm design-pattern-mcp-systemd-dense-cache` resets
      # it to the image's baked snapshot.
      - dense-cache:/app/data/dense-cache
    restart: on-failure
    healthcheck:
      # TCP probe on the port the server actually binds (PORT
      # above): the server binds only AFTER warmup, so connect = fully ready.
      # The `--health` CLI flag is deliberately NOT the probe — it exercises the
      # OFFLINE embedder, so it reports healthy while the HTTP surface is still
      # down (and would have reported healthy even with the transport mis-scoped).
      test:
        [
          "CMD",
          "python",
          "-c",
          "import socket; socket.create_connection(('127.0.0.1', 8050), timeout=5).close()",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 1800s # cold start embeds the whole catalog when no cache is baked

networks:
  pattern-tei-shared:
    external: true

volumes:
  # Fixed name (no compose project prefix): one stable cache per stack.
  # `docker compose down -v` deletes it (a recreated volume is re-seeded from
  # the image's baked snapshot, so reset-to-cold needs a cache-less image).
  dense-cache:
    name: design-pattern-mcp-systemd-dense-cache
