# CPU lane for the systemd stack: retunes the decision seams for the in-stack
# `tacit` CPU sidecar the way docker/docker-compose.tacit-cpu.yml retunes the dev
# stack. The sidecar itself needs no override — it is already CPU-native where it
# is defined (systemd/docker-compose.decision-models.yml, profile `tacit-cpu`):
# no devices entry, BF16 dtype, 900 s start period. This file only fixes the lane
# budgets, which the overlay leaves at GPU values (weights 30 s, category 10 s,
# gate 5 s) that a ~15 s/decision CPU gateway can never meet.
#
# Layer it third (see README "Decision models"):
#   COMPOSE_FILE=docker-compose.yml:docker-compose.decision-models.yml:docker-compose.tacit-cpu.yml
#   COMPOSE_PROFILES=tacit-cpu
# in /etc/design-pattern-mcp/.env. Without the profile the seams point at a
# `tacit` host that does not exist and degrade with warnings — the file requires it.
#
# The lane selects the in-stack sidecar outright: RERANKER_PROVIDER and all four
# Tacit endpoints are pinned below (not ${VAR:-default}), so stale GPU-lane lines
# in .env (RERANKER_PROVIDER=tacit, TACIT_GATEWAY_URL=...) are inert while this
# file is layered — a migration only changes COMPOSE_FILE and adds the profile.
services:
  design-pattern-mcp:
    environment:
      # CPU lane (Tacit-4B ~15 s/small-decision idle 2026-11-21): weights ON (32
      # items = 466 s; timeout 900); category ON (31.6 s/choice, serial per part,
      # timeout 120); gate ON (7.8 s/call, timeout 30). Rerank stays TEI:
      # 55 s/full-item x ~35 docs x serial parts (max_concurrent_parts=1) =
      # hours per analyze — infeasible; the capsule-text lane would be the
      # alternative, not full text.
      # TIMEOUT lines also make host overrides reachable (config.json {env:…} sees
      # just what compose passes).
      # Pinned, not defaulted: a GPU-to-CPU migration leaves RERANKER_PROVIDER=tacit
      # in .env (README step 2), and an explicit env wins over ${VAR:-default} —
      # the lane would then run the hours-per-analyze Tacit rerank it exists to avoid.
      - RERANKER_PROVIDER=tei
      - RERANKER_TACIT_BASE_URL=http://tacit:8100
      - RERANKER_TACIT_TIMEOUT_SECONDS=${RERANKER_TACIT_TIMEOUT_SECONDS:-60}
      - DECISIONS_STYLE_ENABLED=${DECISIONS_STYLE_ENABLED:-true}
      - DECISIONS_WEIGHTS_ENABLED=${DECISIONS_WEIGHTS_ENABLED:-true}
      # Endpoints pinned (see header): a stale TACIT_GATEWAY_URL must not redirect
      # this lane at an external gateway. Same for category and gate below.
      - DECISIONS_WEIGHTS_BASE_URL=http://tacit:8100
      - DECISIONS_WEIGHTS_TIMEOUT_SECONDS=${DECISIONS_WEIGHTS_TIMEOUT_SECONDS:-900}
      - DECISIONS_CATEGORY_ENABLED=${DECISIONS_CATEGORY_ENABLED:-true}
      - DECISIONS_CATEGORY_BASE_URL=http://tacit:8100
      - DECISIONS_CATEGORY_TIMEOUT_SECONDS=${DECISIONS_CATEGORY_TIMEOUT_SECONDS:-120}
      - DECISIONS_REASONING_GATE_ENABLED=${DECISIONS_REASONING_GATE_ENABLED:-true}
      - DECISIONS_REASONING_GATE_BASE_URL=http://tacit:8100
      - DECISIONS_REASONING_GATE_TIMEOUT_SECONDS=${DECISIONS_REASONING_GATE_TIMEOUT_SECONDS:-30}
      # The lane runs the ~466 s Tacit weights call inside the workflow budget
      # (0.9 x deadline): at 1800 s a 900+900 retry passes 1620 s and dies with
      # ERR_014 before the LLM fallback, so the lane budget is 3600 s.
      - TASKS_DEADLINE_SECONDS=${TASKS_DEADLINE_SECONDS:-3600}
