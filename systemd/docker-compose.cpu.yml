# CPU lane for the systemd stack: same services, client batch sized for the
# CPU TEI pair. This stack itself never needs a GPU (TEI is external); the
# only lane difference here is EMBEDDER_BATCH_SIZE.
#   sudo install -m 644 systemd/docker-compose.cpu.yml /etc/design-pattern-mcp/
#   # append to /etc/design-pattern-mcp/.env:
#   COMPOSE_FILE=docker-compose.yml:docker-compose.cpu.yml
#   sudo systemctl reload design-pattern-mcp
#
# The TEI side must run the CPU pair: on the pattern-tei-infra host, retag the
# -cpu images onto the names the infra compose expects and restart it:
#   docker tag design-pattern-tei-embed-cpu:latest pattern-tei-embed:latest
#   docker tag design-pattern-tei-rerank-cpu:latest pattern-tei-rerank:latest
#   sudo systemctl restart pattern-tei-infra
# (build them first with `make docker-build-tei-cpu` if they are not local.)
# The -cpu pair serves the same model repos as the GPU pair, so the dense
# cache is shared — switching lanes never forces a re-embed. Switch back by
# removing the COMPOSE_FILE line, retagging the -gpu images, and reloading
# both units.
services:
  design-pattern-mcp:
    environment:
      # candle-on-CPU caps the embed model's max_batch_requests at 4 (see
      # docker/Dockerfile.tei-embed-cpu); the base file's default of 8 assumes
      # the GPU pair. Larger client batches still work but are split into
      # sequential sub-batches inside one HTTP request, which risks the client
      # timeout on long ones. An explicit EMBED_CLIENT_BATCH_SIZE in .env still
      # wins over this default — lower it when switching lanes.
      - EMBEDDER_BATCH_SIZE=${EMBED_CLIENT_BATCH_SIZE:-4}
