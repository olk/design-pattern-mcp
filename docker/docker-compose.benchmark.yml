# Additive benchmark override (plan §2.10):
#  - publishes the TEI sidecars on loopback for manual host-native harness runs
#    (`make benchmark-sidecars-up`)
#  - adds the `benchmark` service that executes the harness modules in-container
#    (scripts/benchmark-docker.sh → the make benchmark-* targets): ../tests carries
#    the harness + corpora, ../config keeps manifest provenance in sync with the
#    server's bind-mounted config, ../data/dense-cache is the repo's disposable
#    cache the in-process arms require (never the persistent named volume).
# The base file is NOT edited; merge the two:
#
#   docker compose -f docker/docker-compose.yml -f docker/docker-compose.benchmark.yml …
#
# The published ports are bound to 127.0.0.1 on purpose: a benchmark must never expose the
# unauthenticated sidecars beyond the workstation. Override the host ports with BENCH_EMBED_PORT /
# BENCH_RERANK_PORT.
services:
  # A benchmark stack must never warm, populate or invalidate the persistent
  # dense-cache volume: mode=off embeds the corpus per start and touches no
  # cache directory, so an arm can neither measure a warm start nor leave a
  # snapshot that silently becomes the next arm's starting state. Bites when the
  # MCP service is started under this override (`make benchmark-e2e` does).
  design-pattern-mcp:
    environment:
      - DENSE_CACHE_MODE=off

  design-pattern-tei-embed:
    ports:
      - "127.0.0.1:${BENCH_EMBED_PORT:-18081}:8080" # container port is the base file's 8080

  design-pattern-tei-rerank:
    ports:
      - "127.0.0.1:${BENCH_RERANK_PORT:-18082}:8080"

  # In-container benchmark runner. Entrypoint override: the image ENTRYPOINT is
  # `python -m src.main` (the server); the benchmark targets pass
  # `-m tests.benchmark.harness.* …` as the compose-run command instead.
  # CLIENT_URL / EMBEDDER_BASE_URL / RERANKER_BASE_URL defaults are the compose
  # service DNS names, so the e2e client and the in-process arms reach the same
  # inference servers as the containerized server (no loopback ports involved).
  # Generator/decision env is forwarded per-run by scripts/benchmark-docker.sh.
  benchmark:
    image: ${MCP_IMAGE:-design-pattern-mcp:latest}
    entrypoint: ["/app/.venv/bin/python"]
    environment:
      - CLIENT_URL=${BENCH_CLIENT_URL:-http://design-pattern-mcp:8050/mcp}
      - EMBEDDER_BASE_URL=http://design-pattern-tei-embed:8080/v1
      - EMBEDDER_API_KEY=${EMBEDDER_API_KEY:-tei-noauth}
      - RERANKER_BASE_URL=http://design-pattern-tei-rerank:8080
      - DENSE_CACHE_PATH=/app/data/dense-cache
    volumes:
      - ../tests:/app/tests:ro
      - ../config:/app/config:ro
      - ../data/dense-cache:/app/data/dense-cache
