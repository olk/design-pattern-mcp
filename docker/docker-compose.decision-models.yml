# Decision-model override: adds the GPU sidecar and turns the seams on.
#
# This file is an explicit opt-in layer, never a default:
#   docker compose -f docker/docker-compose.yml -f docker/docker-compose.decision-models.yml up -d
#   make docker-up-decisions
#
# The one sidecar is GPU-only: design-pattern-tacit is Tacit-4B (~8 GB) in vLLM plus the
# AnyJev gateway, and it answers every seam (Ch2 style, J1 rerank, J2 category, J4 weights,
# J5 gate) from the single self-distilled checkpoint.
#
# Every seam is switched on here and only here: the base compose file has no
# decision-model env at all, and config/config.json defaults every seam to false.
# An outage of the sidecar degrades to the non-model path (LLM style and weights,
# TEI rerank, unfiltered retrieval, reasoning runs) — it never fails a tool call.
name: design-pattern-mcp-dev

services:
  design-pattern-tacit:
    image: ${TACIT_IMAGE:-design-pattern-tacit:latest}
    container_name: design-pattern-tacit-dev
    restart: unless-stopped
    environment:
      # All weights are baked into the image; the gateway must not reach the Hub.
      - HF_HUB_OFFLINE=1
      # false = one forward per decision (deterministic, the shipped behaviour).
      - TACIT_ADAPTIVE=${TACIT_ADAPTIVE:-false}
    ports:
      # Loopback only: anyjev.serve has no auth of its own (its own docstring), so this
      # sidecar must never be reachable beyond the workstation — same rule as the
      # benchmark TEI override. The publish is what confines it: the container itself
      # listens on 0.0.0.0 so the bridge can forward. A host-network run has no publish,
      # so it must pass TACIT_BIND_HOST=127.0.0.1 (see docker/tacit-entrypoint.sh).
      - "127.0.0.1:18100:8100" # dev host port; container 8100 = the gateway
    # GPU via CDI (`nvidia.com/gpu=N`), not the legacy `deploy.reservations.devices`
    # reservation with `driver: nvidia`: that form only injects the driver's devices and
    # libraries when the container's runtime is nvidia-container-runtime (a runc shim), so
    # under any other default runtime the container starts with no /dev/nvidia* and vLLM
    # dies with "CUDA unknown error". A CDI device name is resolved by the daemon into the
    # OCI spec, so it works with runc, crun or any other runtime (docker >= 25 with CDI
    # enabled, nvidia-container-toolkit >= 1.12 generating /etc/cdi or /var/run/cdi).
    devices:
      - nvidia.com/gpu=0
    healthcheck:
      test:
        [
          "CMD",
          "python3",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8100/v1/stats', timeout=5)",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 300s

  design-pattern-mcp:
    environment:
      # J1 rerank: Tacit's per-candidate relevance leg in front of the fused pool; the TEI
      # sidecar stays the mandatory fallback inside the client, so it remains a dependency.
      - RERANKER_PROVIDER=${RERANKER_PROVIDER:-tacit}
      - RERANKER_TACIT_BASE_URL=http://design-pattern-tacit:8100
      # Ch2 style: the Tacit two-stage choice (category -> <=26-style shortlist), no
      # credential (local). Default OFF: the seam's own A/B was candidate-loss
      # (docs/JEV_BENCHMARK_REPORT.md), so it stays dark until calibration says otherwise.
      # Enable only with a floor from `make tacit-calibrate`
      # (models/tacit-calibration.json), set in the same command:
      #   DECISIONS_STYLE_ENABLED=true DECISIONS_STYLE_CONFIDENCE_FLOOR=<floor> make docker-up-decisions
      - DECISIONS_STYLE_ENABLED=${DECISIONS_STYLE_ENABLED:-false}
      - DECISIONS_STYLE_BASE_URL=http://design-pattern-tacit:8100
      - DECISIONS_STYLE_MODEL=tacit-4b
      - DECISIONS_STYLE_CONFIDENCE_FLOOR=${DECISIONS_STYLE_CONFIDENCE_FLOOR:-0.5}
      # J4 weights: Tacit score questions, 8 axes per part.
      - DECISIONS_WEIGHTS_ENABLED=${DECISIONS_WEIGHTS_ENABLED:-true}
      - DECISIONS_WEIGHTS_BASE_URL=http://design-pattern-tacit:8100
      - DECISIONS_WEIGHTS_MODEL=tacit-4b
      # J2 category: soft 9-way narrowing of the retrieved pool.
      - DECISIONS_CATEGORY_ENABLED=${DECISIONS_CATEGORY_ENABLED:-true}
      - DECISIONS_CATEGORY_BASE_URL=http://design-pattern-tacit:8100
      - DECISIONS_CATEGORY_MODEL=tacit-4b
      # J5 gate: skip deliberation when the decision is already determined.
      - DECISIONS_REASONING_GATE_ENABLED=${DECISIONS_REASONING_GATE_ENABLED:-true}
      - DECISIONS_REASONING_GATE_BASE_URL=http://design-pattern-tacit:8100
      - DECISIONS_REASONING_GATE_MODEL=tacit-4b
    depends_on:
      design-pattern-tacit:
        condition: service_healthy
