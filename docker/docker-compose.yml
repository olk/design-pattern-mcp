# Development stack: MCP server + both TEI sidecars.
#   make docker-build-all   # once: sidecar images (~6 GB download), server image, dense cache
#   make docker-up          # start everything from the images built above
#   make docker-down
# Offline variant (no sidecars, deterministic lexical retrieval):
#   docker compose -f docker/docker-compose.yml --profile offline up -d
#
# Service names design-pattern-tei-embed/-rerank deliberately match the
# base_url defaults baked into config/config.json, so the embedded config
# works unmodified; env entries below are explicit overrides only.

name: design-pattern-mcp-dev

services:
  design-pattern-mcp:
    image: ${MCP_IMAGE:-design-pattern-mcp:latest}
    container_name: design-pattern-mcp-dev
    environment:
      - TRANSPORT=streamable-http
      - HOST=0.0.0.0
      - PORT=8050
      # INFO keeps the log actionable: the embedded reasoning servers forward every
      # "💭 …" thinking note as notifications/message, which this server emits at DEBUG
      # (src/reasoning/client.py::reasoning_log_handler). Raise to DEBUG to see them.
      - LOGGING_LEVEL=INFO
      - LOGGING_FORMAT=json
      # Generator (LLM): drives ANALYZE/GENERATE/EVALUATE. Dev default = Muse Spark
      # 1.3 Contributor via the OpenCode Go gateway (OpenAI-compatible chat
      # completions; the gateway requires the x-opencode-session header, which the
      # agent sets — litellm/httpx user agents pass the Cloudflare front, unlike
      # Python-urllib). The key falls back to OPENCODE_API_KEY from the host env or
      # .env, and any GENERATOR_* value overrides it for another provider. Without a
      # key the server still starts and retrieval works — each LLM call fails with
      # ERR_009 and the pipeline takes its documented degraded paths (E3/E4/E12).
      # The provider prefix lives in MODEL (litellm convention): the
      # GENERATOR_PROVIDER value only labels error messages.
      - GENERATOR_PROVIDER=${GENERATOR_PROVIDER:-opencode-go}
      - GENERATOR_MODEL=${GENERATOR_MODEL:-openai/muse-spark-1.3-contributor}
      - GENERATOR_BASE_URL=${GENERATOR_BASE_URL:-https://opencode.ai/zen/go/v1}
      - GENERATOR_API_KEY=${GENERATOR_API_KEY:-${OPENCODE_API_KEY:-}}
      - GENERATOR_SESSION_ID=${GENERATOR_SESSION_ID:-design-pattern-mcp}
      # Provider-boundary timeout (seconds) for every generator call. The config
      # placeholder is otherwise unreachable from the host without editing the
      # bind-mounted config/config.json.
      - GENERATOR_TIMEOUT_SECONDS=${GENERATOR_TIMEOUT_SECONDS:-300.0}
      # Provider reliability knobs: applications per GENERATE call, the per-agent circuit
      # breaker (3 qualifying failures -> 60 s of local rejection) and the whole-run
      # execution budget (ERR_014 on expiry; independent of the per-call timeout above).
      - GENERATOR_GENERATION_BATCH_SIZE=${GENERATOR_GENERATION_BATCH_SIZE:-5}
      - GENERATOR_CIRCUIT_BREAKER_FAILURE_THRESHOLD=${GENERATOR_CIRCUIT_BREAKER_FAILURE_THRESHOLD:-3}
      - GENERATOR_CIRCUIT_BREAKER_COOLDOWN_SECONDS=${GENERATOR_CIRCUIT_BREAKER_COOLDOWN_SECONDS:-60.0}
      - TASKS_DEADLINE_SECONDS=${TASKS_DEADLINE_SECONDS:-1800.0}

      # Embedder: /v1 suffix selects TEI's OpenAI-compatible route for litellm.
      # Client batch 8 == the ORT backend's max_batch_requests cap for this model
      # (the sidecar reports "Backend does not support a batch size > 8" and forces
      # it). Measured 2026-09-24: a 32-input client batch makes TEI split the call
      # into 4 sequential sub-batches inside ONE HTTP request, which then exceeds
      # the client's request timeout — every call raised APITimeoutError and the
      # cache build made no progress, while batch 8 completed 60 requests in ~14 min.
      # Raise EMBED_CLIENT_BATCH_SIZE only together with an embedder timeout that
      # covers the longer request.
      - EMBEDDER_BASE_URL=http://design-pattern-tei-embed:8080/v1
      - EMBEDDER_BATCH_SIZE=${EMBED_CLIENT_BATCH_SIZE:-8}
      # Dense embedding cache: /app/data/dense-cache ships baked into the image
      # (`make docker-build` generates it before the build) and is backed by the
      # NAMED volume below, so (a) a fresh volume is seeded from the image by
      # Docker and (b) every later write — a re-embed after a model swap or a
      # catalogue change — survives image rebuilds, container recreation and
      # `docker compose down`. The cache is reloaded on restart with zero corpus
      # embed calls once warm; only the probe text is embedded (one call) to
      # confirm the served model still matches the snapshot.
      # Reset: `docker volume rm design-pattern-mcp-dev-dense-cache` (a fresh
      # volume is re-seeded from the image — an EXISTING one keeps its own, so
      # delete it after a catalogue/model-changing rebuild to avoid one forced
      # re-embed). For a genuinely cold cache use `make docker-build-nocache`
      # or set DENSE_CACHE_MODE=off.
      - DENSE_CACHE_PATH=/app/data/dense-cache
      - DENSE_CACHE_MODE=${DENSE_CACHE_MODE:-auto}
      - DENSE_CACHE_WRITE=true
      # Declared sidecar-model identity for the cache fingerprint (empty = probe decides).
      - EMBED_MODEL_REPO=${EMBED_MODEL_REPO:-}
      - EMBED_ONNX_VARIANT=${EMBED_ONNX_VARIANT:-}
      # litellm routes openai/* models through the OpenAI SDK, which refuses to
      # construct its client with api_key=None even for a local api_base. TEI does
      # no auth, so any non-empty string satisfies the SDK (must stay in sync with
      # EMBEDDER_BATCH_SIZE=8 <= MAX_CLIENT_BATCH_SIZE=32 invariant above).
      - EMBEDDER_API_KEY=${EMBEDDER_API_KEY:-tei-noauth}
      # Stage-1 recall per leg (§6 step 2): 0 = full corpus (lossless). Measured 2026-09-24
      # on the 486-document catalog: lossless recall feeds all 486 documents (10 chunks of
      # <= 48, ~58 s each) to the cross-encoder per decision part; 20/20 bounds the fused
      # pool to <= 40, i.e. exactly one chunk per part. Must stay in sync with
      # RERANKER_MAX_BATCH_SIZE (48): dense_top_k + bm25_top_k <= that value.
      - RETRIEVAL_DENSE_TOP_K=${RETRIEVAL_DENSE_TOP_K:-20}
      - RETRIEVAL_BM25_TOP_K=${RETRIEVAL_BM25_TOP_K:-20}
      # Reasoning: both scratchpad servers ship enabled for all five phases; each
      # phase can be switched off or re-budgeted without editing the bind-mounted
      # config. Host names mirror the config placeholders.
      - REASONING_ENABLED=${REASONING_ENABLED:-true}
      - REASONING_MAX_TOTAL_STEPS=${REASONING_MAX_TOTAL_STEPS:-8}
      - REASONING_QUIET_STDERR=${REASONING_QUIET_STDERR:-true}
      - REASONING_FAIL_FAST=${REASONING_FAIL_FAST:-false}
      - REASONING_ANALYZE_ENABLED=${REASONING_ANALYZE_ENABLED:-true}
      - REASONING_ANALYZE_THOUGHTS=${REASONING_ANALYZE_THOUGHTS:-2}
      - REASONING_WEIGHTS_ENABLED=${REASONING_WEIGHTS_ENABLED:-true}
      - REASONING_WEIGHTS_THOUGHTS=${REASONING_WEIGHTS_THOUGHTS:-2}
      - REASONING_GENERATE_ENABLED=${REASONING_GENERATE_ENABLED:-true}
      - REASONING_GENERATE_THOUGHTS=${REASONING_GENERATE_THOUGHTS:-2}
      - REASONING_EVALUATE_ENABLED=${REASONING_EVALUATE_ENABLED:-true}
      - REASONING_EVALUATE_THOUGHTS=${REASONING_EVALUATE_THOUGHTS:-2}
      - REASONING_RETRY_ENABLED=${REASONING_RETRY_ENABLED:-true}
      - REASONING_RETRY_THOUGHTS=${REASONING_RETRY_THOUGHTS:-2}
      # Decision model (JEV) Ch2 style substitution: opt-in, default off.
      - DECISIONS_ENABLED=${DECISIONS_ENABLED:-true}
      - DECISIONS_BASE_URL=${DECISIONS_BASE_URL:-https://opencode.ai/inference/systemone/v1}
      - DECISIONS_MODEL=${DECISIONS_MODEL:-jev-1.13-free}
      - DECISIONS_STYLE_CONFIDENCE_FLOOR=${DECISIONS_STYLE_CONFIDENCE_FLOOR:-0.5}
      - DECISIONS_TIMEOUT_SECONDS=${DECISIONS_TIMEOUT_SECONDS:-5}
      - OPENCODE_API_KEY=${OPENCODE_API_KEY:-}
    depends_on:
      design-pattern-tei-embed:
        condition: service_healthy
      design-pattern-tei-rerank:
        condition: service_healthy
    ports:
      - "8822:8050" # dev host port; container 8050 = image default
    volumes:
      - ../config:/app/config # edit config without rebuilding
      # Dense-cache snapshot (see the env block above): a NAMED volume keeps
      # manifest.json + vectors.npy across image upgrades and container
      # recreation, and out of the git working tree.
      - dense-cache:/app/data/dense-cache
    restart: on-failure
    healthcheck:
      # TCP probe on the port the server actually binds (PORT above;
      # image default is 8050). It must be the CONTAINER port, not a hardcoded
      # one: probing a port nothing listens on reports the service unhealthy forever.
      # The server binds only AFTER warmup, so connect = fully ready; --health would
      # exercise the OFFLINE embedder, not the serving path.
      test:
        [
          "CMD",
          "python",
          "-c",
          "import socket; socket.create_connection(('127.0.0.1', 8050), timeout=5).close()",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 1800s # cold start embeds the whole catalog through TEI (~20 min on CPU)

  design-pattern-tei-embed:
    image: ${TEI_IMAGE:-design-pattern-tei-embed:latest}
    container_name: design-pattern-tei-embed-dev
    restart: unless-stopped
    # No published ports — internal only, reached via Docker DNS.
    environment:
      - HF_HUB_OFFLINE=1
      - HUGGINGFACE_HUB_CACHE=/data
      - MAX_CONCURRENT_REQUESTS=32
      - MAX_BATCH_TOKENS=8192
      - WARMUP_TOKENS=${TEI_WARMUP_TOKENS:-0}
      - MAX_CLIENT_BATCH_SIZE=32
      - AUTO_TRUNCATE=true
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 120s # model load on CPU is slow

  design-pattern-tei-rerank:
    image: ${TEI_RERANK_IMAGE:-design-pattern-tei-rerank:latest}
    container_name: design-pattern-tei-rerank-dev
    restart: unless-stopped
    environment:
      - HF_HUB_OFFLINE=1
      - HUGGINGFACE_HUB_CACHE=/data
      - MAX_CONCURRENT_REQUESTS=64
      - WARMUP_TOKENS=${TEI_RERANK_WARMUP_TOKENS:-0}
      - MAX_CLIENT_BATCH_SIZE=48
      - AUTO_TRUNCATE=true
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

volumes:
  # Fixed name (no compose project prefix): one stable cache per stack, immune
  # to `-p`/directory renames. `docker compose down -v` deletes it.
  dense-cache:
    name: design-pattern-mcp-dev-dense-cache
