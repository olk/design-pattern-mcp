# GPU override for the embed sidecar. Prerequisites: an NVIDIA GPU, the NVIDIA
# container toolkit, and an embed image built from the CUDA base:
#   make docker-build-tei-embed-gpu
#   make docker-up-gpu
services:
  design-pattern-tei-embed:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
