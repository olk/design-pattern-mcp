# CPU override for the decision-model stack: swaps the Tacit sidecar from the GPU
# image (docker/Dockerfile.tacit-gpu) to the CPU image (docker/Dockerfile.tacit-cpu).
# Usage: make docker-up-decisions-cpu
services:
  design-pattern-tacit:
    image: ${TACIT_CPU_IMAGE:-design-pattern-tacit-cpu:latest}
    environment:
      - HF_HUB_OFFLINE=1
      - TACIT_ADAPTIVE=${TACIT_ADAPTIVE:-false}
      - TACIT_DTYPE=bfloat16
      - VLLM_CPU_KVCACHE_SPACE=${VLLM_CPU_KVCACHE_SPACE:-8}
    # !reset drops the base file's devices: [nvidia.com/gpu=0] (Compose >= 2.24);
    # plain `devices: []` does not reliably remove entries across versions.
    devices: !reset []
    shm_size: "4gb" # vLLM CPU: --shm-size=4g
    cap_add: [SYS_NICE] # NUMA get_mempolicy/migrate_pages
    security_opt: [seccomp=unconfined]
    healthcheck:
      start_period: 900s # CPU model load is slower than the GPU 300 s

  design-pattern-mcp:
    environment:
      # CPU lane (Tacit-4B ~15 s/small-decision idle 2026-11-21): weights ON (32
      # items = 466 s; timeout 900); category ON (31.6 s/choice, serial per part,
      # timeout 120); gate ON (7.8 s/call, timeout 30 — inert while reasoning is
      # pinned off below, but wired). Rerank stays TEI: 55 s/full-item x ~35 docs
      # x serial parts (max_concurrent_parts=1) = hours per analyze — infeasible;
      # the capsule-text lane would be the alternative, not full text.
      # TIMEOUT lines also make host overrides reachable (config.json {env:…} sees
      # just what compose passes).
      - RERANKER_PROVIDER=${RERANKER_PROVIDER:-tei}
      - RERANKER_TACIT_TIMEOUT_SECONDS=${RERANKER_TACIT_TIMEOUT_SECONDS:-60}
      - DECISIONS_STYLE_ENABLED=${DECISIONS_STYLE_ENABLED:-true}
      - DECISIONS_WEIGHTS_ENABLED=${DECISIONS_WEIGHTS_ENABLED:-true}
      - DECISIONS_WEIGHTS_TIMEOUT_SECONDS=${DECISIONS_WEIGHTS_TIMEOUT_SECONDS:-900}
      - DECISIONS_CATEGORY_ENABLED=${DECISIONS_CATEGORY_ENABLED:-true}
      - DECISIONS_CATEGORY_TIMEOUT_SECONDS=${DECISIONS_CATEGORY_TIMEOUT_SECONDS:-120}
      - DECISIONS_REASONING_GATE_ENABLED=${DECISIONS_REASONING_GATE_ENABLED:-true}
      - DECISIONS_REASONING_GATE_TIMEOUT_SECONDS=${DECISIONS_REASONING_GATE_TIMEOUT_SECONDS:-30}
      # The lane runs the ~466 s Tacit weights call inside the workflow budget
      # (0.9 x deadline): at 1800 s a 900+900 retry passes 1620 s and dies with
      # ERR_014 before the LLM fallback, so the lane budget is 3600 s.
      - TASKS_DEADLINE_SECONDS=${TASKS_DEADLINE_SECONDS:-3600}
