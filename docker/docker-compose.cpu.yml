# CPU lane for the dev stack: same services, -cpu TEI pair, no GPU reservation.
#   make docker-build-tei-cpu   # once: builds design-pattern-tei-{embed,rerank}-cpu:latest
#   make docker-up-cpu          # this file merged over docker-compose.yml
#
# The -cpu pair serves the same model repos as the GPU pair, so the dense
# cache (manifest model_repo/onnx_variant) is shared — switching lanes with
# `make docker-up` / `make docker-up-cpu` never forces a re-embed.
#
# `deploy: !reset {}` drops the base file's CDI GPU reservation (Compose
# `!reset` tag: reset the value instead of merging). Without it the stack
# would not start on a GPU-less host.
services:
  design-pattern-mcp:
    environment:
      # candle-on-CPU caps the embed model's max_batch_requests at 4 (see
      # docker/Dockerfile.tei-embed-cpu); larger client batches still work
      # but are split into sequential sub-batches inside one HTTP request,
      # which risks the client timeout on long ones.
      - EMBEDDER_BATCH_SIZE=${EMBED_CLIENT_BATCH_SIZE:-4}

  design-pattern-tei-embed:
    image: ${TEI_IMAGE_CPU:-design-pattern-tei-embed-cpu:latest}
    deploy: !reset {}

  design-pattern-tei-rerank:
    image: ${TEI_RERANK_IMAGE_CPU:-design-pattern-tei-rerank-cpu:latest}
    deploy: !reset {}
